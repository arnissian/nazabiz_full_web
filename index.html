<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rcm-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion entreprise</title>

        
    <style>
      /* Définition de la couleur primaire (modifiez la valeur si besoin) */
      :root {
        --primary-color: #45368f; /* Exemple : Bleu primaire moderne */
      }

      /* Styles du preloader */
      .global-preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ffffff;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }

      @media (prefers-color-scheme: dark) {
        .global-preloader {
          background-color: #1a1a1a;
        }
      }

      .spinner-chase {
        margin: 0 auto;
        width: 40px;
        height: 40px;
        position: relative;
        animation: spinner-chase 2.5s infinite linear both;
      }

      .chase-dot {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
        animation: chase-dot 2.0s infinite ease-in-out both;
      }

      .chase-dot:before {
        content: '';
        display: block;
        width: 25%;
        height: 25%;
        /* Utilisation de la couleur primaire ici */
        background-color: var(--primary-color);
        border-radius: 100%;
        animation: chase-dot-before 2.0s infinite ease-in-out both;
      }

      .chase-dot:nth-child(1) { animation-delay: -1.1s; }
      .chase-dot:nth-child(2) { animation-delay: -1.0s; }
      .chase-dot:nth-child(3) { animation-delay: -0.9s; }
      .chase-dot:nth-child(4) { animation-delay: -0.8s; }
      .chase-dot:nth-child(5) { animation-delay: -0.7s; }
      .chase-dot:nth-child(6) { animation-delay: -0.6s; }
      .chase-dot:nth-child(1):before { animation-delay: -1.1s; }
      .chase-dot:nth-child(2):before { animation-delay: -1.0s; }
      .chase-dot:nth-child(3):before { animation-delay: -0.9s; }
      .chase-dot:nth-child(4):before { animation-delay: -0.8s; }
      .chase-dot:nth-child(5):before { animation-delay: -0.7s; }
      .chase-dot:nth-child(6):before { animation-delay: -0.6s; }

      @keyframes spinner-chase {
        100% { transform: rotate(360deg); }
      }

      @keyframes chase-dot {
        80%, 100% { transform: rotate(360deg); }
      }

      @keyframes chase-dot-before {
        50% {
          transform: scale(0.4);
        }
        100%, 0% {
          transform: scale(1.0);
        }
      }

      .global-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
    </style>
     </head>
  <body>

      <!-- Preloader en dehors de root -->
    <div class="global-preloader" id="global-preloader">
      <div class="spinner-chase">
        <div class="chase-dot"></div>
        <div class="chase-dot"></div>
        <div class="chase-dot"></div>
        <div class="chase-dot"></div>
        <div class="chase-dot"></div>
        <div class="chase-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    
    <!-- Bootstrap JS (doit être chargé APRÈS le DOM) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    
    <!-- Votre app React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
